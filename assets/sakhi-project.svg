<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Sakhi women’s safety companion</title>
  <desc id="description">A mobile safety app concept with emergency helplines, trusted contacts, and an SOS button.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4fc"/>
      <stop offset="1" stop-color="#e7f5f4"/>
    </linearGradient>
    <linearGradient id="sos" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec5364"/>
      <stop offset="1" stop-color="#c91f3b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="670" cy="102" r="108" fill="#fff" opacity=".65"/>
  <circle cx="114" cy="530" r="148" fill="#d7f1ec" opacity=".75"/>

  <rect x="243" y="43" width="314" height="514" rx="40" fill="#1d1b3a"/>
  <rect x="257" y="59" width="286" height="482" rx="29" fill="#f6f4fb"/>
  <rect x="351" y="70" width="98" height="13" rx="7" fill="#1d1b3a"/>

  <text x="282" y="123" fill="#1d1b3a" font-family="Arial, sans-serif" font-size="25" font-weight="700">Sakhi</text>
  <text x="282" y="148" fill="#5d5a78" font-family="Arial, sans-serif" font-size="12">A little support, right when you need it.</text>

  <rect x="280" y="169" width="240" height="52" rx="14" fill="#fff" stroke="#dcd8ec" stroke-width="2"/>
  <circle cx="300" cy="195" r="7" fill="#36bda8"/>
  <text x="317" y="193" fill="#1d1b3a" font-family="Arial, sans-serif" font-size="13" font-weight="700">Your trusted people</text>
  <text x="317" y="210" fill="#5d5a78" font-family="Arial, sans-serif" font-size="11">Ready to help when you need them</text>

  <circle cx="400" cy="337" r="94" fill="#efcbd0"/>
  <circle cx="400" cy="337" r="78" fill="url(#sos)"/>
  <circle cx="400" cy="337" r="61" fill="none" stroke="#fff" stroke-opacity=".82" stroke-width="3"/>
  <text x="400" y="337" fill="#fff" font-family="Arial, sans-serif" font-size="38" font-weight="800" text-anchor="middle">SOS</text>
  <text x="400" y="359" fill="#fff" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">HOLD TO ACTIVATE</text>
  <text x="400" y="457" fill="#5d5a78" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Emergency support is one press away</text>

  <rect x="280" y="480" width="113" height="38" rx="11" fill="#1d1b3a"/>
  <text x="336" y="504" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">CALL 112</text>
  <rect x="403" y="480" width="117" height="38" rx="11" fill="#137a6f"/>
  <text x="461" y="504" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">SHARE LOCATION</text>

  <g font-family="Arial, sans-serif">
    <rect x="48" y="183" width="160" height="66" rx="16" fill="#fff" stroke="#dcd8ec" stroke-width="2"/>
    <circle cx="74" cy="216" r="12" fill="#e8f5f4"/>
    <path d="M69 216h10M74 211v10" stroke="#137a6f" stroke-width="2.5" stroke-linecap="round"/>
    <text x="96" y="212" fill="#1d1b3a" font-size="13" font-weight="700">Trusted contacts</text>
    <text x="96" y="231" fill="#5d5a78" font-size="11">Private on this device</text>

    <rect x="592" y="328" width="166" height="70" rx="16" fill="#fff" stroke="#dcd8ec" stroke-width="2"/>
    <circle cx="620" cy="363" r="12" fill="#e8f5f4"/>
    <path d="M620 354c-5 0-8 4-8 8 0 6 8 13 8 13s8-7 8-13c0-4-3-8-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z" fill="#137a6f"/>
    <text x="642" y="359" fill="#1d1b3a" font-size="13" font-weight="700">Share location</text>
    <text x="642" y="379" fill="#5d5a78" font-size="11">Send a map link quickly</text>
  </g>
</svg>
